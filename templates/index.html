<!DOCTYPE html>
<html>
<head>
    <title>Submit Data</title>
</head>
<body>

    <h1>Submit Your Data</h1>

    <!-- Display error message on the same page -->
    {% if error %}
        <p style="color: red; font-weight: bold;">
            {{ error }}
        </p>
    {% endif %}

    <form method="POST" action="/submit">

        <label>Name:</label>
        <input type="text" name="name" value="{{ name or '' }}" required>

        <br><br>

        <label>Email:</label>
        <input type="email" name="email" value="{{ email or '' }}" required>

        <br><br>

        <label>Course:</label>
        <input type="text" name="course" value="{{ course or '' }}" required>

        <br><br>

        <button type="submit">Submit</button>

    </form>
<hr>

<h2>To-Do List</h2>

<form action="/submittodoitem" method="POST">

    <label for="itemName">Item Name:</label><br>
    <input type="text" id="itemName" name="itemName" required><br><br>

    <label for="itemDescription">Item Description:</label><br>
    <textarea id="itemDescription" name="itemDescription" rows="5" cols="40" required></textarea><br><br>

    <button type="submit">Add To-Do Item</button>

</form>
</body>
</html>
